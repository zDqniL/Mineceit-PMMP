name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  all-php-versions:
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    uses: ./.github/workflows/main-php-matrix.yml
    with:
      php: ${{ matrix.php }}
    secrets: inherit

  codestyle:
    name: Code Style checks
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP and tools
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: 8.3
          tools: php-cs-fixer:3.75
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff --ansi

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0

  translations:
    name: Translation checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: 8.3

      - name: Verify translations
        run: php .github/workflows/verify-translations.php ${{ github.workspace }}/resources/translations

  codegen:
    name: Codegen freshness
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: 8.3
          extensions: yaml,igbinary,zip,curl,gmp,sockets,zlib,bcmath

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Regenerate codegen
        run: composer run update-codegen

      - name: Fail if generated/ is out of sync with sources
        run: |
          if ! git diff --exit-code -- generated/; then
            echo "::error::generated/ is stale. Run 'composer run update-codegen' locally and commit the result."
            exit 1
          fi
