name: Draft release

on:
  push:
    branches:
      - stable
      - 1.26.40
  workflow_dispatch:

permissions:
  contents: write

env:
  PHP_VERSION: "8.2"

jobs:
  draft:
    name: Create GitHub release
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ['self-hosted', 'Linux']
    steps:
      # Le phar n'embarque que resources/, src/ et vendor/ (build/server-phar.php), et aucune
      # étape ci-dessous ne lit l'historique git ni les submodules : un checkout superficiel suffit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          install-path: "./bin"
          pm-version-major: 5

      - name: Restore Composer package cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: "composer-v2-cache-${{ hashFiles('./composer.lock') }}"
          restore-keys: |
            composer-v2-cache-

      - name: Add composer auth
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --ignore-platform-reqs

      - name: Regenerate codegen
        run: composer run update-codegen

      - name: Fail if generated/ is out of sync with sources
        run: |
          if ! git diff --exit-code -- generated/; then
            echo "::error::generated/ is stale. Run 'composer run update-codegen' locally and commit the result before releasing."
            exit 1
          fi

      - name: Calculate build number
        id: build-number
        run: |
          BUILD_NUMBER=$((2300+$GITHUB_RUN_NUMBER))
          echo "Build number: $BUILD_NUMBER"
          echo BUILD_NUMBER=$BUILD_NUMBER >> $GITHUB_OUTPUT

      - name: Minify BedrockData JSON files
        run: php vendor/altayofficial/bedrock-data/.minify_json.php

      - name: Build PocketMine-MP.phar
        run: php -dphar.readonly=0 build/server-phar.php --git ${{ github.sha }} --build ${{ steps.build-number.outputs.BUILD_NUMBER }}

      - name: Get PocketMine-MP release version
        id: get-pm-version
        run: |
          dump() { php -d display_errors=0 build/dump-version-info.php "$1" | tail -n 1; }
          echo PM_VERSION=$(dump base_version) >> $GITHUB_OUTPUT
          echo MCPE_VERSION=$(dump mcpe_version) >> $GITHUB_OUTPUT
          echo MCPE_DISPLAY_VERSION=$(dump mcpe_display_version) >> $GITHUB_OUTPUT
          echo CHANGELOG_FILE_NAME=$(dump changelog_file_name) >> $GITHUB_OUTPUT
          echo CHANGELOG_MD_HEADER=$(dump changelog_md_header) >> $GITHUB_OUTPUT
          echo PRERELEASE=$(dump prerelease) >> $GITHUB_OUTPUT
          echo CHANNEL=$(dump channel) >> $GITHUB_OUTPUT

      - name: Create release
        uses: ncipollo/release-action@v1.16.0
        with:
          artifacts: "PocketMine-MP.phar,start.*"
          commit: ${{ github.sha }}
          name: "PocketMine-MP ${{ steps.get-pm-version.outputs.PM_VERSION }}"
          tag: ${{ steps.get-pm-version.outputs.PM_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ steps.get-pm-version.outputs.PRERELEASE }}
          body: |
            **For Minecraft: Bedrock Edition ${{ steps.get-pm-version.outputs.MCPE_VERSION }} (display version ${{ steps.get-pm-version.outputs.MCPE_DISPLAY_VERSION }})**

            Please see the [changelogs](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.get-pm-version.outputs.PM_VERSION }}/changelogs/${{ steps.get-pm-version.outputs.CHANGELOG_FILE_NAME }}#${{ steps.get-pm-version.outputs.CHANGELOG_MD_HEADER }}) for details.

      - name: Send discord release
        continue-on-error: true
        run: |
          php .github/tools/send-release-webhook.php "PocketMine-MP.phar" ${{ steps.get-pm-version.outputs.PM_VERSION }} ${{ steps.build-number.outputs.BUILD_NUMBER }}
